user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Tailscale Serve terminates HTTPS before forwarding to this listener.
    map $http_x_forwarded_proto $gateway_scheme {
        default $scheme;
        http http;
        https https;
    }
    map $http_host $gateway_host {
        default $http_host;
        "" $host;
    }
    map $http_upgrade $gateway_connection {
        default upgrade;
        "" "";
    }

    access_log off;
    server_tokens off;
    client_max_body_size 0;
    client_body_timeout 3600s;
    send_timeout 3600s;

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;

        # Locations change variables rather than proxy_set_header directives,
        # preserving this complete header policy in every location.
        set $gateway_authorization $http_authorization;
        set $gateway_cookie $http_cookie;
        set $gateway_accept_encoding $http_accept_encoding;
        proxy_set_header Host $gateway_host;
        proxy_set_header X-Forwarded-Host $gateway_host;
        proxy_set_header X-Forwarded-Proto $gateway_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $gateway_authorization;
        proxy_set_header Cookie $gateway_cookie;
        proxy_set_header Accept-Encoding $gateway_accept_encoding;
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header X-WEBAUTH-EMAIL "";
        proxy_set_header X-WEBAUTH-FULLNAME "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gateway_connection;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_redirect http://127.0.0.1:3001/ $gateway_scheme://$gateway_host/;

        # Web and REST API authentication remain Gitea's normal authentication.
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3001;
        }

        # Gitea reflects Basic auth into LFS batch action headers. Redact that
        # value from this JSON response; object transfers below authenticate at
        # the gateway again. Never apply a text filter to Git packs/LFS objects.
        location ~ "^/[^/]+/[^/]+/info/lfs/objects/batch$" {
            set $gateway_cookie "";
            set $gateway_accept_encoding "";
            include /data/git-gateway/auth*.conf;
            sub_filter_types application/vnd.git-lfs+json application/json;
            sub_filter $gateway_authorization "";
            sub_filter_once off;
            proxy_pass http://127.0.0.1:3001;
        }

        # Explicit Gitea Smart HTTP and LFS endpoints only. Both /repo.git/...
        # and /repo/... work. Repository web pages/settings never match here.
        location ~ "^/[^/]+/[^/]+/(?:info/refs|git-upload-pack|git-receive-pack|git-upload-archive|info/lfs/(?:objects/[0-9a-fA-F]{64}(?:/[^/]+)?|verify|locks/?|locks/verify|locks/[0-9]+/unlock))$" {
            set $gateway_cookie "";
            include /data/git-gateway/auth*.conf;
            proxy_pass http://127.0.0.1:3001;
        }

        location / {
            proxy_pass http://127.0.0.1:3001;
        }
    }
}
